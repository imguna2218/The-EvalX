# Bind to all interfaces (for Docker accessibility)
bind 0.0.0.0

# Set a max memory limit
maxmemory 512mb

# Eviction policy when memory is full
maxmemory-policy allkeys-lru

# Enable AOF persistence
appendonly yes

# AOF fsync policy
appendfsync everysec

# Save RDB snapshots
save 300 100

# Port to listen on
port 6379