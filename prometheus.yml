global:
  scrape_interval: 15s

# ADDED: This section tells Prometheus where to find your alert rule definitions.
rule_files:
  - "prometheus.rules.yml"

# ADDED: This section configures how Prometheus communicates with the Alertmanager.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: 'evalx'
    static_configs:
      # This target points to your native application from inside the Docker network
      - targets: ['host.docker.internal:3000']