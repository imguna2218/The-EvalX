[package]
name = "evalx"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
axum = { version = "0.7.5", features = ["ws"] }
bollard = "0.16"
dotenv = "0.15"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tower = { version = "0.4", features = ["limit"] }
tower-http = { version = "0.5", features = ["cors", "trace", "timeout", "set-header"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.10", features = ["v4"] }
redis = { version = "0.23.0", features = ["tokio-comp", "connection-manager"] }
sha2 = "0.10"
hex = "0.4"
tar = "0.4"
tokio-stream = "0.1" 
rand = "0.8.5"
priority-queue = "1.3"
num_cpus = "1.16"
sysinfo = "0.29"
mobc = "0.8"
mobc-redis = "0.8"
async-trait = "0.1"