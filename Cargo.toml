[package]
name = "evalx"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
axum = { version = "0.7.5", features = ["ws"] }
dotenv = "0.15"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tower = { version = "0.4", features = ["limit"] }
tower-http = { version = "0.5", features = ["cors", "trace", "timeout", "set-header", "limit"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.10", features = ["v4"] }
redis = { version = "0.23.0", features = ["tokio-comp", "connection-manager"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8.5"
num_cpus = "1.16"
sysinfo = "0.29"
mobc = "0.8"
mobc-redis = "0.8.0"
async-trait = "0.1"
prometheus = { version = "0.13", features = ["process"] }
lazy_static = "1.4.0"
flate2 = "1.0"
toml = "0.8" # ADDED: For parsing TOML configuration files
glob = "0.3" # ADDED: For finding all language config files in a directory
tempfile = "3"
core_affinity = "0.8"