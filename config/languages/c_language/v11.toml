is_compiled = true
source_filename = "main.c"
executable_filename = "main"
chroot_path = "/opt/evalx/chroots/c/v11"

[compile]
command = ["/usr/bin/gcc", "-std=c11", "-O2", "-o", "main", "main.c", "-lm"]
limits = { time_s = 10, memory_kb = 1048576, processes = 500 }

[run]
command = ["./main"]
limits = { time_s = 10, memory_kb = 1048576, processes = 500 }