is_compiled = true
source_filename = "Main.cs"
executable_filename = "Main"
chroot_path = "/opt/evalx/chroots/csharp/v11"

# REMOVE "proc" and "sys" to avoid double-mount issues
mount_paths = ["usr", "lib", "lib64", "bin", "sbin", "etc", "usr/share"]

[env_vars]
PATH = "/usr/bin:/bin:/usr/share/dotnet"
DOTNET_ROOT = "/usr/share/dotnet"
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_NOLOGO = "1"
HOME = "/tmp"

[compile]
# This command compiles the code, then bundles the DLL and Config into a single 'Main' script using base64.
# This ensures all necessary files exist in the Runtime Sandbox.
command = [
    "/bin/bash",
    "-c",
    "ulimit -c 0 && /usr/bin/csharp-compiler Main.cs bin 1>&2 && echo '#!/bin/bash' > Main && echo 'echo \"'$(base64 -w0 bin.dll)'\" | base64 -d > bin.dll' >> Main && echo 'echo \"'$(base64 -w0 bin.runtimeconfig.json)'\" | base64 -d > bin.runtimeconfig.json' >> Main && echo 'exec dotnet bin.dll \"$@\"' >> Main && chmod +x Main"
]
# We keep the high memory limit for compilation
limits = { time_s = 15, memory_kb = 1572864, processes = 200 }

[run]
command = ["./Main"]
limits = { time_s = 5, memory_kb = 524288, processes = 100 }