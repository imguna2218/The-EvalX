is_compiled = true
source_filename = "Main.java"
executable_filename = "Main.class"
chroot_path = "/opt/evalx/chroots/java/v21"

# These mount paths are correct and match your builder script
mount_paths = ["usr", "lib", "lib64", "bin", "etc", "var", "dev", "proc", "sys"]

# --- ALL PATHS BELOW ARE CORRECTED ---
# They now point to the '/usr/lib/jvm/java-21-openjdk-amd64' path
# that your new chroot builder script creates.

[env_vars]
LD_LIBRARY_PATH = "/usr/lib/jvm/java-21-openjdk-amd64/lib/jli:/usr/lib/jvm/java-21-openjdk-amd64/lib/server:/usr/lib/jvm/java-21-openjdk-amd64/lib"
JAVA_HOME = "/usr/lib/jvm/java-21-openjdk-amd64"
PATH = "/usr/lib/jvm/java-21-openjdk-amd64/bin:/usr/bin:/bin"

[compile]
command = [
    "/usr/lib/jvm/java-21-openjdk-amd64/bin/javac",
    "-J-XX:TieredStopAtLevel=1",
    "-J-Xms512m",
    "-J-Xmx512m",
    "-J-XX:MaxMetaspaceSize=192m",
    "-J-XX:ReservedCodeCacheSize=64m",
    "-J-XX:+UseSerialGC",
    "Main.java",
]
limits = { time_s = 8, memory_kb = 1536000, processes = 150 } # 1.5GB

[run]
command = [
    "/usr/lib/jvm/java-21-openjdk-amd64/bin/java",
    "-Xms256m", "-Xmx256m",
    "-XX:MaxMetaspaceSize=64m",
    "-XX:ReservedCodeCacheSize=32m",
    "-XX:+UseSerialGC",
    "Main",
]
limits = { time_s = 8, memory_kb = 786432, processes = 50 } # 768MB