version: '3.8'

services:
  # The Redis service, now with persistent data storage and custom config
  redis:
    image: redis:7.0-alpine
    container_name: evalx_redis
    restart: always
    ports:
      - "6379:6379"
    # Mount the custom redis.conf to apply your settings
    volumes:
      - ./Docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
      # Use a named volume to make sure data persists even if the container is removed
      - redis-data:/data
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - evalx-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The main web application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evalx_app
    restart: always
    ports:
      - "3000:3000"
    env_file: .env
    # ADDED: Mount the Docker socket to allow container management from the app
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # The app service depends on redis being healthy before it starts
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - evalx-network

  # The background worker service, which can be scaled
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    # REMOVED: The container_name line was removed to allow scaling.
    restart: always
    # This command tells the application to start in "worker" mode
    command: ["./evalx", "worker"]
    env_file: .env
    # ADDED: Mount the Docker socket to allow container management from workers
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Workers also depend on redis being healthy
    depends_on:
      redis:
        condition: service_healthy
    # This section allows you to easily scale the number of worker containers
    deploy:
      replicas: 4
    networks:
      - evalx-network

# Define the network for services to communicate
networks:
  evalx-network:
    driver: bridge

# Define the named volume for Redis data persistence
volumes:
  redis-data: