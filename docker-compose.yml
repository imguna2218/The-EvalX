services:
  # The Redis service, now with persistent data storage and custom config
  redis:
    image: redis:7.0-alpine
    container_name: evalx_redis
    restart: unless-stopped
    user: "root"
    ports:
      - "6379:6379"
    volumes:
      - ./Docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis-data:/data
    networks:
      - evalx-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The main web application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evalx_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    # --- FIX: Reverted to privileged mode ---
    # The 'cap_add' list was insufficient for Isolate's need to create
    # private mount namespaces, causing the "Permission denied" error.
    # Privileged mode grants the container the necessary kernel permissions.
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - evalx-network

  # The background worker service
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["./evalx", "worker"]
    env_file: .env
    # --- FIX: Reverted to privileged mode ---
    # The workers execute Isolate directly, so they require the same
    # level of permissions as the main app container.
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - evalx-network

# Define the network for services to communicate
networks:
  evalx-network:
    driver: bridge

# Define the named volume for Redis data persistence
volumes:
  redis-data:

