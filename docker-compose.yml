services:
  redis:
    image: redis:7.0-alpine
    container_name: evalx_redis
    restart: unless-stopped
    user: "root"
    ports:
      - "6379:6379"
    volumes:
      - ./Docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis-data:/data
    networks:
      - evalx-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  evalx-network:
    driver: bridge

volumes:
  redis-data: